<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/images/favicon.png">
<title>탑시크릿 학원 연구소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* 학원메이트 디자인 토큰 · 레이아웃: 상단 바(브랜드+탭) + 아래 전체를 채우는 도구 화면 */
:root{--ink:#1e2a5a;--ink-2:#3b4670;--muted:#6b6b6b;--line:#f0dbe7;--bg:#ffffff;--soft:#fdf0f6;--soft-2:#fce4ef;
--primary:#e6007e;--primary-dark:#b8005f;--accent:#ffd400;--accent-ink:#1e2a5a;--white:#ffffff;--bar:60px;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.top{border-bottom:1px solid var(--line);background:var(--white);flex:0 0 auto;padding-top:env(safe-area-inset-top,0px)}
.top .wrap{max-width:1100px;margin:0 auto;padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;height:var(--bar)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;letter-spacing:-0.04em;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand svg{width:28px;height:25px;display:block}
.brand small{font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0;margin-left:2px}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:999px;border:2px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap}
nav button:hover{filter:brightness(.96)}
nav button[data-t="notice"]{background:var(--soft);color:var(--ink);border-color:var(--line)}
nav button[data-t="thumb"]{background:var(--accent);color:var(--accent-ink)}
nav button[data-t="topic"]{background:#e8f1ff;color:#1d4ed8;border-color:#bfd6ff}
nav button[aria-selected="true"]{background:var(--primary);color:var(--white);border-color:var(--primary);box-shadow:0 4px 12px rgba(230,0,126,.25)}
nav button[data-t="topic"][aria-selected="true"]{background:#1d4ed8;border-color:#1d4ed8;box-shadow:0 4px 12px rgba(29,78,216,.25)}
nav button[data-t="thumb"][aria-selected="true"]{background:#111;color:var(--accent);border-color:#111;box-shadow:0 4px 12px rgba(0,0,0,.2)}
nav button:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav button .n[hidden]{display:none}
nav button .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;text-align:center}
.stage{flex:1 1 auto;min-height:0;position:relative}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--white)}
.stage iframe[hidden]{display:none}
.panel{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.panel[hidden]{display:none}
.notice{max-width:760px;margin:0 auto;padding:28px 16px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:26px;line-height:1.3;letter-spacing:-0.02em;margin:0 0 6px;font-weight:800}
h1 em{font-style:normal;color:var(--primary)}
.lead{font-size:15px;color:var(--ink-2);margin:0 0 20px}
.board{border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px 1fr 118px 84px;align-items:center;gap:8px;padding:12px 6px;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.row.head{font-size:12.5px;font-weight:700;color:var(--muted);background:var(--soft);padding:9px 6px}
.row .no{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.row .ttl{min-width:0;font-weight:700;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:6px;overflow:hidden}
.row .ttl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ttl:hover span{text-decoration:underline;color:var(--primary-dark)}
.row .pin{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);padding:1px 7px;border-radius:5px;flex:0 0 auto}
.row .new{font-size:10px;font-weight:800;color:var(--primary);flex:0 0 auto}
.row .who{text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .when{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:560px){.row{grid-template-columns:1fr 72px;padding:11px 4px}.row .no,.row .who,.row.head .when{display:none}.row.head{display:none}.board{border-top-width:1px}}
.view{border:1px solid var(--line);border-radius:16px;background:var(--white);overflow:hidden}
.view-h{padding:16px 18px 12px;border-bottom:1px solid var(--line);background:var(--soft)}
.view-h h2{font-size:19px;margin:0 0 6px;font-weight:800;letter-spacing:-0.01em;line-height:1.35}
.view-h .meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12.5px;color:var(--muted)}
.view-h .meta b{font-weight:700;color:var(--accent-ink);background:var(--accent);padding:1px 8px;border-radius:5px}
.view-b{padding:16px 18px 18px;font-size:15px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.view-b a{color:var(--primary-dark);text-decoration:underline}
.view-b img{max-width:100%;border-radius:10px;display:block;margin:8px 0}
.view-f{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.back{font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--white);color:var(--ink-2);cursor:pointer;text-decoration:none}
.back:hover{border-color:var(--primary);color:var(--primary-dark)}
.empty{color:var(--muted);font-size:15px;padding:28px;border:1px dashed var(--line);border-radius:16px;text-align:center}
.tools{margin:0 0 8px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools a{display:block;padding:16px 18px;border:0;border-radius:14px;color:var(--ink);text-decoration:none;box-shadow:0 4px 14px rgba(30,42,90,.10);transition:transform .15s,box-shadow .15s}
.tools a:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,42,90,.16)}
.tools a[href="#thumb"]{background:var(--accent);color:#1e2a5a}
.tools a[href="#topic"]{background:#1d4ed8;color:var(--white)}
.tools b{display:block;font-size:16px;font-weight:800}
.tools b::after{content:" →";font-weight:900}
.tools span{font-size:12.5px;opacity:.85}
.tools a[href="#thumb"] span{color:#3b4670}
.tools a[href="#topic"] span{color:#e8f1ff}
.sec{font-size:18px;font-weight:800;letter-spacing:-0.02em;margin:26px 0 10px}
.admin{margin-top:28px;font-size:12.5px;color:var(--muted)}
.admin a{color:var(--primary-dark)}
.btn{display:inline-block;font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:10px;border:0;background:var(--primary);color:var(--white);text-decoration:none;cursor:pointer}
@media (max-width:560px){.brand small{display:none}.brand{font-size:16px}nav button{font-size:13px;padding:7px 11px}.tools{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#notice" id="brand"><svg viewBox="10 8 148 132" aria-hidden="true"><path d="M26 44q40-14 58 4v82q-18-16-58-4z" fill="#1a5cff"/><path d="M142 44q-40-14-58 4v82q18-16 58-4z" fill="#9db7ff"/><circle cx="84" cy="30" r="14" fill="#ffd400"/></svg>탑시크릿 학원 연구소<small>by 친절한미녀강사</small></a>
  <nav id="nav" role="tablist" aria-label="메뉴">
    <button type="button" role="tab" data-t="notice" aria-selected="true">공지<span class="n" id="ncount" hidden>0</span></button>
    <button type="button" role="tab" data-t="thumb" aria-selected="false">후킹 썸네일 메이커</button>
    <button type="button" role="tab" data-t="topic" aria-selected="false">블로그 주제 연구소</button>
  </nav>
</div></header>

<div class="stage">
  <section class="panel" id="p-notice" role="tabpanel">
    <div class="notice">
      <h1>탑시크릿 <em>학원 연구소</em></h1>
      <p class="lead">친절한미녀강사가 수강생 원장님께 드리는 공지와, 학원 마케팅에 바로 쓰는 도구를 한곳에 모았습니다.</p>
      <div class="tools">
        <a href="#thumb"><b>후킹 썸네일 메이커</b><span>블로그 제목·릴스 썸네일 15~20자 문구를 유형별로 3개씩</span></a>
        <a href="#topic"><b>블로그 주제 연구소</b><span>과목·대상만 고르면 목적별 블로그 글 주제와 글 방향 추천</span></a>
      </div>
      <h2 class="sec">공지</h2>
      <div id="posts"><div class="empty">공지를 불러오는 중…</div></div>
      <p class="admin" id="admin">공지 작성은 운영자(친절한미녀강사)만 할 수 있습니다. <a href="https://github.com/trend-park/academymate/issues/new?labels=%EA%B3%B5%EC%A7%80&title=%5B%EA%B3%B5%EC%A7%80%5D%20" target="_blank" rel="noopener">운영자 공지 쓰기</a> · <a href="https://github.com/trend-park/academymate/issues" target="_blank" rel="noopener">공지 관리</a></p>
    </div>
  </section>
  <iframe id="f-thumb" title="후킹 썸네일 메이커" hidden loading="lazy"></iframe>
  <iframe id="f-topic" title="블로그 주제 연구소" hidden loading="lazy"></iframe>
</div>

<script>
(() => {
"use strict";
const SRC = { thumb: "/title-cwxzr1/", topic: "/blogtopic-h3q8z/" };
const REPO = "trend-park/academymate";
const OWNER = "trend-park";            // 이 계정이 쓴 이슈만 공지로 표시
const AUTHOR_LABEL = "친절한미녀강사";
const $ = (s) => document.querySelector(s);

let posts = [], loaded = false;
function parseHash() { const h = location.hash.slice(1); const m = h.match(/^notice-(\d+)$/); return m ? { t: "notice", id: +m[1] } : { t: h }; }
function show(t, id) {
  if (!["notice","thumb","topic"].includes(t)) t = "notice";
  document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.t === t ? "true" : "false"));
  $("#p-notice").hidden = t !== "notice";
  ["thumb","topic"].forEach(k => { const f = $("#f-" + k); if (t === k && !f.src) f.src = SRC[k]; f.hidden = t !== k; });
  const want = t === "notice" && id ? "#notice-" + id : "#" + t;
  if (location.hash !== want) history.replaceState(null, "", want);
  document.title = (t === "notice" ? "공지" : t === "thumb" ? "후킹 썸네일 메이커" : "블로그 주제 연구소") + " · 탑시크릿 학원 연구소";
  if (t === "notice") renderNotice(id);
}
$("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) show(b.dataset.t); });
window.addEventListener("hashchange", () => { const h = parseHash(); show(h.t, h.id); });
document.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener("click", e => { e.preventDefault(); show(a.getAttribute("href").slice(1)); }));

/* ----- 공지: GitHub 이슈(운영자가 쓴 열린 이슈)를 게시판 목록/본문으로 표시 ----- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(md) {
  let s = esc(md || "").replace(/\r\n?/g, "\n");
  s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, (m, a, u) => `<img src="${u}" alt="${a}" loading="lazy">`);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  s = s.replace(/(^|[^"=>])(https?:\/\/[^\s<]+)/g, (m, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/^#{1,3}\s+(.+)$/gm, "<b>$1</b>");
  return s;
}
const fmt = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`; };
const isNew = (iso) => (Date.now() - new Date(iso).getTime()) < 3 * 86400000;
const clean = (t) => t.replace(/^\[공지\]\s*/, "");
function renderNotice(id) {
  const box = $("#posts");
  if (!loaded) return;
  if (id) {
    const p = posts.find(x => x.number === id);
    if (!p) { box.innerHTML = `<div class="empty">해당 공지를 찾을 수 없습니다.</div><p style="margin-top:12px"><a class="back" href="#notice">목록으로</a></p>`; bindBack(); return; }
    box.innerHTML = `<article class="view">
      <div class="view-h"><h2>${esc(clean(p.title))}</h2><div class="meta"><b>${AUTHOR_LABEL}</b><span>${fmt(p.created_at)}</span>${p.pinned ? '<span class="pin">고정</span>' : ""}</div></div>
      <div class="view-b">${render(p.body)}</div>
      <div class="view-f"><a class="back" href="#notice">목록으로</a></div></article>`;
    $("#p-notice").scrollTop = 0; bindBack(); return;
  }
  if (!posts.length) { box.innerHTML = `<div class="empty">아직 올라온 공지가 없습니다.</div>`; return; }
  const total = posts.filter(p => !p.pinned).length; let n = total;
  box.innerHTML = `<div class="board"><div class="row head"><span class="no">번호</span><span>제목</span><span class="who">작성자</span><span class="when">날짜</span></div>` +
    posts.map(p => `<div class="row"><span class="no">${p.pinned ? "공지" : n--}</span><a class="ttl" href="#notice-${p.number}">${p.pinned ? '<span class="pin">고정</span>' : ""}<span>${esc(clean(p.title))}</span>${isNew(p.created_at) ? '<span class="new">N</span>' : ""}</a><span class="who">${AUTHOR_LABEL}</span><span class="when">${fmt(p.created_at)}</span></div>`).join("") + `</div>`;
  box.querySelectorAll("a.ttl").forEach(a => a.addEventListener("click", e => { e.preventDefault(); show("notice", +a.getAttribute("href").split("-")[1]); }));
}
function bindBack() { document.querySelectorAll("a.back").forEach(a => a.addEventListener("click", e => { e.preventDefault(); show("notice"); })); }
async function loadNotices() {
  const box = $("#posts");
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/issues?state=open&creator=${OWNER}&per_page=50&sort=created&direction=desc`, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error("http " + r.status);
    const list = (await r.json()).filter(i => !i.pull_request);
    list.forEach(i => i.pinned = (i.labels||[]).some(l => /고정|pinned/i.test(l.name)));
    posts = list.filter(i => i.pinned).concat(list.filter(i => !i.pinned));
    const nc = $("#ncount"); nc.textContent = posts.length; nc.hidden = !posts.length;
    loaded = true;
    const h = parseHash(); if ((h.t || "notice") === "notice") renderNotice(h.id);
  } catch (e) {
    box.innerHTML = `<div class="empty">공지를 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.</div>`;
  }
}
loadNotices();
{ const h = parseHash(); show(h.t || "notice", h.id); }
})();
</script>
</body>
</html>
